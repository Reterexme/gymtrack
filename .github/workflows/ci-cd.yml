# Pipeline CI/CD de GymTrack
# Etapas: 1) Pruebas + calidad  2) Análisis SonarQube  3) Construcción de imagen
#         4) Despliegue automático a entorno de prueba (staging)  5) Escaneo OWASP ZAP
name: CI/CD GymTrack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gymtrack

jobs:
  test:
    name: 1. Pruebas unitarias y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (reglas SonarJS)
        run: npm run lint
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Pruebas con cobertura (falla si baja de 80 %)
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: reports/coverage

  sonarqube:
    name: 2. Análisis de calidad (SonarQube)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: reports/coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  build:
    name: 3. Construcción de imagen Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (y publicar en push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging

  deploy-staging:
    name: 4. Despliegue a entorno de prueba
    needs: [build, sonarqube]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Disparar despliegue en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Prueba de humo (espera a que el servicio responda)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.STAGING_URL }}/api/health" | grep -q '"ok"'; then
              echo "Staging en línea"; exit 0
            fi
            sleep 10
          done
          echo "Staging no respondió"; exit 1

  zap:
    name: 5. Escaneo de seguridad (OWASP ZAP)
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: reporte-zap
