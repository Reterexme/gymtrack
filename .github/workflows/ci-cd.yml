# Pipeline CI/CD de GymTrack
# Etapas: 1) Pruebas + calidad  2) Análisis SonarQube  3) Construcción de imagen
#         4) Despliegue automático a entorno de prueba (staging)  5) Escaneo OWASP ZAP
#
# Las etapas que dependen de servicios externos (SonarQube y Render) se saltan con
# un aviso si su secreto no está configurado, para que el pipeline no falle.
name: CI/CD GymTrack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: 1. Pruebas unitarias y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint (reglas SonarJS)
        run: npm run lint
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Pruebas con cobertura (falla si baja de 80 %)
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: reports/coverage

  sonarqube:
    name: 2. Análisis de calidad (SonarQube)
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Aviso si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no está configurado; se omite el análisis de SonarQube."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: cobertura
          path: reports/coverage
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  build:
    name: 3. Construcción de imagen Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Nombre de la imagen en minúsculas (requisito de Docker)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir (y publicar en push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:staging

  deploy-staging:
    name: 4. Despliegue a entorno de prueba
    needs: [build, sonarqube]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Aviso si falta configuración de Render
        if: env.DEPLOY_HOOK == '' || env.STAGING_URL == ''
        run: echo "::warning::RENDER_DEPLOY_HOOK_URL o STAGING_URL no están configurados; se omite el despliegue."
      - name: Disparar despliegue en Render
        if: env.DEPLOY_HOOK != '' && env.STAGING_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK"
      - name: Prueba de humo (espera a que el servicio responda)
        if: env.DEPLOY_HOOK != '' && env.STAGING_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$STAGING_URL/api/health" | grep -q '"ok"'; then
              echo "Staging en línea"; exit 0
            fi
            sleep 10
          done
          echo "Staging no respondió"; exit 1

  zap:
    name: 5. Escaneo de seguridad (OWASP ZAP)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Levantar GymTrack dentro del pipeline
        run: |
          npm ci --omit=dev
          AUTH_RATE_LIMIT=100000 JWT_SECRET=ci-zap-secret nohup node src/server.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
          artifact_name: reporte-zap
