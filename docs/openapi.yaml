openapi: 3.0.3
info:
  title: GymTrack API
  version: 1.0.0
  description: API del módulo de usuarios, autenticación JWT y rutinas.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Ejercicio:
      type: object
      properties:
        nombre: { type: string, example: Sentadilla }
        series: { type: integer, example: 4 }
        repeticiones: { type: integer, example: 10 }
        peso: { type: number, example: 60 }
paths:
  /api/health:
    get: { summary: Estado del servicio, responses: { '200': { description: OK } } }
  /api/auth/register:
    post:
      summary: Registrar usuario (rol usuario)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: Ana Lopez }
                email: { type: string, example: nueva@gym.com }
                password: { type: string, example: Segura123 }
      responses: { '201': { description: Creado } }
  /api/auth/login:
    post:
      summary: Iniciar sesión y obtener JWT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, example: ana@gym.com }
                password: { type: string, example: Segura123 }
      responses: { '200': { description: OK } }
  /api/auth/me:
    get:
      summary: Perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /api/usuarios:
    get:
      summary: Listar usuarios (admin)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
  /api/usuarios/{id}/rol:
    patch:
      summary: Cambiar rol (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, example: abc } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { rol: { type: string, example: entrenador } } }
      responses: { '200': { description: OK } }
  /api/rutinas:
    get:
      summary: Listar rutinas
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      summary: Crear rutina
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, example: Pierna }
                ejercicios: { type: array, items: { $ref: '#/components/schemas/Ejercicio' } }
      responses: { '201': { description: Creada } }
  /api/rutinas/{id}:
    get:
      summary: Consultar rutina
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, example: abc } }]
      responses: { '200': { description: OK } }
